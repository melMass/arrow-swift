# git-cliff ~ arrow-swift changelog config
# https://git-cliff.org/docs/configuration

[changelog]
header = "# Changelog\n\nAll notable changes to arrow-swift: ArrowKit and Quiver.\n"
# `CLIFF_HIDE_INTERNAL=1` drops the "Internal" group entirely: `release` in
# toolkit.nu sets it for the notes on the release commit and tag, so they skip
# tooling-only changes that still appear in CHANGELOG.md.
body = """
{%- if version %}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else %}
## Unreleased
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
{%- set group_label = group | striptags | trim -%}
{%- if group_label == "Internal" and get_env(name="CLIFF_HIDE_INTERNAL", default="") == "1" -%}
{%- continue -%}
{%- endif %}
### {{ group_label | upper_first }}
{% for commit in commits -%}
- {% if commit.breaking %}**BREAKING** {% endif -%}
{% if commit.scope %}**{{ commit.scope }}:** {% endif -%}
{{ commit.message | upper_first }}
{% endfor %}
{%- endfor -%}
"""
trim = true
render_always = false
postprocessors = []

[git]
conventional_commits = true
filter_unconventional = false   # keep non-conventional commits, route them to "Other"
require_conventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = true
topo_order_commits = true
sort_commits = "newest"
# Releases are `v` tags; other tags (backups) are not releases.
tag_pattern = "^v[0-9]"

commit_preprocessors = [
    # Strip trailing periods.
    { pattern = '\.+$', replace = "" },
]

commit_parsers = [
    # --- Always-skip mechanical noise ---
    { message = "^Merge", skip = true },              # merge commits
    { message = "^chore\\(release\\)", skip = true }, # release-bump (would self-reference)

    # --- User-facing groups ---
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^fix", group = "<!-- 1 -->Fixed" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^doc", group = "<!-- 3 -->Documentation" },
    { message = "^revert", group = "<!-- 5 -->Reverted" },

    # --- Internal but worth surfacing ---
    { message = "^refactor", group = "<!-- 6 -->Refactor" },
    { message = "^test", group = "<!-- 7 -->Tests" },
    { message = "^ci|^build", group = "<!-- 8 -->CI" },
    { message = "^style", group = "<!-- 9 -->Style" },
    { message = "^chore", group = "<!-- 9 -->Chore" },

    # --- Internal: in CHANGELOG.md, hidden from the release notes ---
    { message = "^(ignored|internal)", group = "<!-- 9 -->Internal" },

    # --- Catch-all: anything else (including non-conventional) ---
    { message = ".*", group = "<!-- 9 -->Other" },
]

link_parsers = [
    { pattern = "#(\\d+)", href = "https://github.com/melMass/arrow-swift/issues/$1" },
]
